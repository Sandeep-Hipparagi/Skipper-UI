name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm audit --audit-level=high
      - run: npm run build:registry
      - run: npx tsc --noEmit
      - run: npm run verify:source
      - run: npm run test:unit

  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.tsx', 'src/**/*.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-production-build
          path: .next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e-smoke:
    needs: [verify-and-test, production-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build:registry
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: next-production-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - name: Start production Next.js server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/skipper-next.log 2>&1 &
          echo $! > /tmp/skipper-next.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/skipper-next.log
          exit 1
      - run: npx playwright test tests/e2e/smoke.spec.ts
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop production server
        if: always()
        run: if [ -f /tmp/skipper-next.pid ]; then kill "$(cat /tmp/skipper-next.pid)" || true; fi
